<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triste en amour — Jo</title>
<meta property="og:title" content="Triste en amour — Jo">
<meta property="og:description" content="Nouvel EP de Jo — 6 titres. 2 révélés, 4 à deviner vendredi.">
<meta property="og:image" content="https://jordan-join.fr/triste-en-amour/assets/cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jordan-join.fr/triste-en-amour/assets/cover.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/triste-en-amour/style.css">
</head>
<body>

<div class="grain"></div>

<!-- SECTION 1 : HERO — le titre écrit à même la photo -->
<section class="photo-section hero-section">
  <img src="/triste-en-amour/assets/cover.png" alt="" class="bg-photo bg-photo--hero">
  <div class="scrim scrim--hero"></div>
  <div class="hero-content">
    <p class="hero-kicker">nouvel EP</p>
    <h1 class="hero-title">Triste en amour</h1>
    <p class="hero-artist">Jo</p>
  </div>
</section>

<!-- SECTION 2 : TRACKLIST — écrite sur la même photo, cadrée différemment -->
<section class="photo-section tracklist-section">
  <img src="/triste-en-amour/assets/cover.png" alt="" class="bg-photo bg-photo--tracklist">
  <div class="scrim scrim--tracklist"></div>
  <div class="tracklist-content">
    <p class="section-kicker">la tracklist</p>
    <ol class="tracklist-plain">
      <li><span class="track-num">01</span><span class="track-title">Amoureux</span></li>
      <li><span class="track-num">02</span><span class="track-title">Tinder</span></li>
      <li><span class="track-num">03</span><span class="track-title track-title--unknown"></span></li>
      <li><span class="track-num">04</span><span class="track-title track-title--unknown"></span></li>
      <li><span class="track-num">05</span><span class="track-title track-title--unknown"></span></li>
      <li><span class="track-num">06</span><span class="track-title track-title--unknown"></span></li>
    </ol>
    <a href="/ep2" class="cta-link">écouter Amoureux →</a>
  </div>
</section>

<footer class="footer">
  <p class="footer-signature">Triste en amour</p>
  <span class="footer-copy">© 2026 Jo</span>
</footer>

</body>
</html>
