<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Triste en amour — Jo</title>
<meta property="og:title" content="Triste en amour — Jo">
<meta property="og:description" content="Nouvel EP de Jo — 6 titres. 2 révélés, 4 à deviner vendredi.">
<meta property="og:image" content="https://jordan-join.fr/triste-en-amour/assets/cover.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://jordan-join.fr/triste-en-amour/assets/cover.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Annie+Use+Your+Telescope&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/triste-en-amour/style.css">
</head>
<body>

<div class="grain"></div>

<!-- SECTION 1 : HERO -->
<section class="hero-section">
  <img src="/triste-en-amour/assets/mockup-1.png" alt="Triste en amour — mockup vinyle" class="hero-mockup">
  <div class="hero-content">
    <p class="hero-kicker">nouvel EP</p>
    <h1 class="hero-title">Triste en amour</h1>
    <p class="hero-artist">Jo</p>
    <p class="hero-sub">6 titres. 2 révélés. 4 à deviner.</p>
  </div>
</section>

<!-- SECTION 2 : POCHETTE -->
<section class="cover-section">
  <div class="cover-wrap">
    <img src="/triste-en-amour/assets/cover.png" alt="Pochette — Triste en amour" class="cover-img">
  </div>
</section>

<!-- SECTION 3 : TRACKLIST TEASER -->
<section class="tracklist-section">
  <p class="section-kicker">la tracklist</p>
  <div class="tracklist-wrap">
    <img src="/triste-en-amour/assets/tracklist-flou.png" alt="Tracklist — Triste en amour" class="tracklist-img">
  </div>
  <p class="tracklist-caption">Amoureux et Tinder sont déjà là. Les 4 autres se révèlent vendredi.</p>
</section>

<!-- SECTION 4 : COMPTE À REBOURS -->
<section class="countdown-section">
  <p class="countdown-label">les indices tombent dans</p>
  <div class="countdown-timer">
    <div class="countdown-unit"><span id="cdDays">00</span><small>j</small></div>
    <div class="countdown-unit"><span id="cdHours">00</span><small>h</small></div>
    <div class="countdown-unit"><span id="cdMinutes">00</span><small>m</small></div>
    <div class="countdown-unit"><span id="cdSeconds">00</span><small>s</small></div>
  </div>
  <a href="/ep2" class="cta-link">écouter Amoureux →</a>
</section>

<footer class="footer">
  <p class="footer-signature">Triste en amour</p>
  <span class="footer-copy">© 2026 Jo</span>
</footer>

<script src="/triste-en-amour/script.js"></script>
</body>
</html>
