<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portfolio — Jordan Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* Source du PDF « Portfolio » : pages A4 paysage conçues pour l'impression, générées avec Edge en ligne de commande.
     Contenu : portfolio-pdf/content.js (textes des pages projet) + ch-dreux/data.js (liste et titres). Voir snippets/portfolio-pdf.md. */
  @page { size: 297mm 210mm; margin: 0; }
  :root { --navy:#1a1a2e; --accent:#d66a77; --muted:#5d5d70; --line:#e3e3ec; --soft:#f4f4f8; --f-display:'Bebas Neue',sans-serif; --f-body:'DM Sans',system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:#888; }
  body { font-family:var(--f-body); color:var(--navy); -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  a { color:inherit; text-decoration:none; }
  .pg { position:relative; width:297mm; height:210mm; overflow:hidden; background:#fff; page-break-after:always; break-after:page; margin:0 auto; }
  @media screen { .pg { margin:10mm auto; box-shadow:0 4px 24px rgba(0,0,0,.35); } }

  /* ── Couverture ── */
  .cover { background:var(--navy); color:#fff; display:grid; grid-template-columns:1fr 112mm; grid-template-rows:minmax(0,1fr); }
  .cover-main { padding:20mm 16mm 16mm 22mm; display:flex; flex-direction:column; }
  .eyebrow { font-size:3.2mm; letter-spacing:.34em; text-transform:uppercase; color:var(--accent); font-weight:500; }
  .cover h1 { margin:6mm 0 0; font-family:var(--f-display); font-weight:400; font-size:34mm; line-height:.88; }
  .cover .role { margin:8mm 0 0; max-width:130mm; font-size:4.6mm; line-height:1.5; color:#d8d8e8; }
  .cover-foot { margin-top:auto; display:flex; flex-direction:column; gap:7mm; }
  .qrcard { align-self:flex-start; background:#fff; color:var(--navy); border-radius:3mm; padding:3.2mm; display:flex; align-items:center; gap:4mm; }
  .qrcard svg { width:29mm; height:29mm; flex:none; display:block; }
  .qrcard b { display:block; font-size:3.9mm; line-height:1.25; max-width:62mm; }
  .qrcard span { display:block; margin-top:1mm; font-size:3mm; color:var(--muted); }
  .who { display:flex; align-items:center; gap:4mm; }
  .who img { width:17mm; height:17mm; border-radius:50%; object-fit:cover; object-position:50% 25%; flex:none; border:.5mm solid rgba(255,255,255,.5); }
  .who div { font-size:3.5mm; line-height:1.55; color:#cfcfe2; } .who b { color:#fff; font-weight:500; }
  .mosaic { display:grid; grid-template-columns:1fr 1fr; grid-template-rows:repeat(3,minmax(0,1fr)); gap:3mm; padding:10mm 10mm 10mm 0; background:var(--navy); min-height:0; }
  .mosaic div { background:#fff; border-radius:2mm; overflow:hidden; min-height:0; position:relative; }
  .mosaic img { position:absolute; inset:0; }
  .mosaic img { width:100%; height:100%; object-fit:cover; display:block; }

  /* ── Pages projet : cadre commun ── */
  .proj { padding:11mm 15mm 0 15mm; display:flex; flex-direction:column; }
  .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5mm; font-size:3mm; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); font-weight:500; }
  .top b { color:var(--accent); font-weight:700; }
  .body { flex:1; min-height:0; display:flex; flex-direction:column; }
  .bottom { height:14mm; display:flex; justify-content:space-between; align-items:center; border-top:.3mm solid var(--line); margin-top:3mm; font-size:2.9mm; color:var(--muted); }
  .qrbar { display:flex; gap:9mm; align-items:center; padding:3mm 0 0; height:25mm; flex:none; }
  .qr { display:flex; gap:3mm; align-items:center; width:84mm; }
  .qr svg { width:19mm; height:19mm; flex:none; display:block; border:.4mm solid var(--line); padding:1mm; border-radius:1.5mm; background:#fff; }
  .qr b { display:block; font-size:3.2mm; line-height:1.25; } .qr span { display:block; margin-top:.6mm; font-size:2.6mm; color:var(--muted); word-break:break-all; line-height:1.25; }
  .qr--video svg { border-color:var(--accent); border-width:.6mm; }

  /* ── Page d'ouverture d'un projet ── */
  .intro { flex:1; min-height:0; display:grid; grid-template-columns:119mm 1fr; column-gap:12mm; }
  .tag { margin:0; font-size:3mm; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .intro h2, .ttl { margin:2mm 0 4mm; font-family:var(--f-display); font-weight:400; font-size:11.5mm; line-height:.98; }
  .pull { margin:0 0 4mm; padding-left:3.5mm; border-left:.8mm solid var(--accent); font-size:4mm; line-height:1.3; font-style:italic; }
  .kv { margin:0; } .kv div { margin:0 0 2.6mm; }
  .kv dt { font-size:2.6mm; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .kv dd { margin:.6mm 0 0; font-size:3.3mm; line-height:1.4; }
  .hero { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; }
  .hero .frame { flex:none; width:100%; display:flex; align-items:center; justify-content:center; padding:0; }
  .hero img { max-width:100%; max-height:134mm; object-fit:contain; display:block; border-radius:2mm; box-shadow:0 1.5mm 6mm rgba(26,26,46,.2); }
  .cap { margin-top:2mm; font-size:2.8mm; color:var(--muted); text-align:center; }

  /* ── Page de texte ── */
  .txt { flex:1; min-height:0; display:grid; grid-template-columns:150mm 1fr; column-gap:10mm; }
  .txt.wide { grid-template-columns:104mm 1fr; }
  .txt.solo { grid-template-columns:1fr; }
  .txt.below { display:flex; flex-direction:column; row-gap:5mm; } .txt.below p.t { max-width:215mm; } .txt.below .imgs { flex:1; }
  .lab { margin:0; font-size:3mm; letter-spacing:.2em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .txt .ttl { font-size:10mm; margin:1.6mm 0 3.5mm; }
  .txt p.t { margin:0 0 2.6mm; font-size:3.45mm; line-height:1.48; }
  .sub { margin-top:5mm; }
  .cards { display:grid; gap:3mm; margin:3mm 0 0; } .cards.c3 { grid-template-columns:repeat(3,1fr); } .cards.c2 { grid-template-columns:1fr 1fr; } .cards.c1 { grid-template-columns:1fr; }
  .card { background:var(--soft); border-radius:2mm; padding:3.4mm 3.8mm; } .card b { display:block; font-size:3.5mm; margin-bottom:1.2mm; } .card span { font-size:3.2mm; line-height:1.42; display:block; }
  .chip-l { margin:3.6mm 0 1.4mm; font-size:2.6mm; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:700; }
  .chips { display:flex; flex-wrap:wrap; gap:1.6mm; } .chips span { font-size:3mm; padding:1mm 2.8mm; border:.3mm solid var(--line); border-radius:99mm; background:#fff; }
  .imgs { display:grid; gap:5mm; grid-auto-rows:1fr; min-height:0; align-self:stretch; }
  .imgs figure { margin:0; min-height:0; display:flex; flex-direction:column; }
  .imgs .im, .cell .im { flex:1; min-height:0; border-radius:2mm; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#fff; border:.3mm solid var(--line); }
  .imgs img, .cell img { width:100%; height:100%; display:block; object-fit:contain; }
  .imgs.tri figure:first-child { grid-column:1 / -1; }
  .imgs figcaption, .cell figcaption { margin-top:1.4mm; font-size:2.8mm; color:var(--muted); text-align:center; line-height:1.25; }

  /* ── Page de galerie ── */
  .grid-head { margin-bottom:4mm; }
  .grid-head .ttl { font-size:9mm; margin:1.4mm 0 2mm; }
  .grid-head p { margin:0; font-size:3.3mm; line-height:1.45; color:var(--muted); max-width:235mm; }
  .grid { flex:1; min-height:0; display:grid; gap:5mm; }
  .cell { margin:0; min-height:0; display:flex; flex-direction:column; }
  .cell .im { background:transparent; }
  .grid.cover .im { background:transparent; } .grid.cover img { object-fit:cover; }
  /* une seule rangée : les images gardent leur proportion, centrées verticalement, légende collée dessous */
  .grid.row1 { align-content:center; align-items:center; }
  .grid.row1 .im { flex:none; } .grid.row1 img { height:auto; object-fit:initial; }

  /* ── Dernière page ── */
  .end { background:var(--navy); color:#fff; padding:20mm 22mm; display:grid; grid-template-columns:1fr 1fr; column-gap:16mm; }
  .end h2 { margin:5mm 0 0; font-family:var(--f-display); font-weight:400; font-size:26mm; line-height:.9; }
  .end p { margin:6mm 0 0; font-size:4.2mm; line-height:1.55; color:#d8d8e8; max-width:105mm; }
  .bigqr { margin-top:9mm; background:#fff; color:var(--navy); border-radius:3mm; padding:4mm; display:inline-flex; gap:5mm; align-items:center; }
  .bigqr svg { width:46mm; height:46mm; display:block; } .bigqr b { display:block; font-size:4.4mm; line-height:1.25; max-width:48mm; } .bigqr span { display:block; margin-top:1.5mm; font-size:3.2mm; color:var(--muted); }
  .cats { align-self:center; display:grid; grid-template-columns:1fr 1fr; gap:6mm; }
  .catq { background:#fff; color:var(--navy); border-radius:3mm; padding:4mm; display:flex; gap:3.5mm; align-items:center; }
  .catq svg { width:24mm; height:24mm; flex:none; display:block; } .catq b { font-size:3.6mm; line-height:1.25; display:block; } .catq span { display:block; margin-top:1mm; font-size:2.8mm; color:var(--muted); }
  .end .contact { grid-column:1 / -1; align-self:end; font-size:3.5mm; color:#cfcfe2; } .end .contact b { color:#fff; font-weight:500; }
</style>
</head>
<body>
<div id="doc"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="/ch-dreux/data.js"></script>
<script src="/portfolio-pdf/content.js"></script>
<script src="/portfolio-pdf/img/opt/map.js"></script>
<script>
(function () {
  'use strict';
  var D = window.CH_DREUX, C = window.PDF_CONTENT, SITE = 'https://jordan-join.fr';
  var OFFER_URL = SITE + '/ch-dreux/';          /* page dédiée à l'offre (QR de la couverture) */
  var doc = document.getElementById('doc');

  /* Adresses de chaque projet : page publique (pub) et/ou vidéo (video) */
  var X = {
    'tenofort': { pub: '/projet-tenofort.html' }, 'livrets': { pub: '/projet-labrha-da.html' }, 'pandora': { pub: '/projet-pandora.html' },
    'vasculyon-id': { pub: '/projet-vasculyon-id.html' }, 'vogalib': { pub: '/projet-vogalib.html' }, 'metz-affiches': { pub: '/projet-metz.html' },
    'f3df-3d': { video: 'https://www.youtube.com/playlist?list=PL2CHMYGVYwZPm5mbNN0n8H8RynHfGQmTO', vlabel: 'Regarder la série vidéo' },
    'metz-film': { video: 'https://youtu.be/GDNlsrFAnxE', vlabel: 'Regarder le film' },
    'labrha-site': { pub: 'https://www.laboratoire-labrha.fr/', plabel: 'Découvrir le site' }, 'vasculyon-site': { pub: 'https://vasculyon.fr', plabel: 'Découvrir le site' },
    'labrha-reseaux': { pub: '/projet-labrha-social.html' }, 'f3df-reseaux': { pub: '/projet-f3df.html' }, 'salons-labrha': {},
    'graille': { video: SITE + '/projet-graille.html#s-videos', vlabel: 'Regarder le spot', pub: '/projet-graille.html', plabel: 'Voir le projet en ligne' },
    'lettre-hebdo': { pub: '/ch-dreux/lettre-hebdo/', plabel: 'Feuilleter les lettres' }, 'formation-cyber': { pub: '/ch-dreux/formation-cybersecurite/', plabel: 'Feuilleter la formation' },
    'formation-photo': { pub: '/ch-dreux/formation-photo/', plabel: 'Feuilleter la formation' }
  };
  function abs(u) { return /^https?:/.test(u) ? u : SITE + u; }
  function shortUrl(u) { return u.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''); }
  function h(tag, cls, html) { var n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; }
  function txt(tag, cls, t) { var n = h(tag, cls); n.textContent = t; return n; }
  function img(src, alt) { var i = document.createElement('img'); i.src = (window.IMG_MAP && window.IMG_MAP[src]) || src; i.alt = alt || ''; i.decoding = 'sync'; return i; }

  function qrSvg(url) {
    var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    var n = qr.getModuleCount(), q = 2, size = n + q * 2, d = '';
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) if (qr.isDark(r, c)) d += 'M' + (c + q) + ' ' + (r + q) + 'h1v1h-1z';
    return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" shape-rendering="crispEdges" role="img" aria-label="QR code vers ' + shortUrl(url) + '"><rect width="' + size + '" height="' + size + '" fill="#fff"/><path d="' + d + '" fill="#1a1a2e"/></svg>';
  }
  function qrBlock(url, title, cls) {
    var a = h('a', 'qr' + (cls ? ' ' + cls : '')); a.href = url; a.innerHTML = qrSvg(url);
    var t = h('div'); t.appendChild(txt('b', '', title)); t.appendChild(txt('span', '', shortUrl(url))); a.appendChild(t); return a;
  }

  var allUrl = SITE + '/projets.html';
  var pages = [];

  /* ───── Couverture : mosaïque de projets, petite photo ───── */
  var cover = h('section', 'pg cover');
  var main = h('div', 'cover-main');
  main.appendChild(txt('div', 'eyebrow', 'Portfolio'));
  main.appendChild(h('h1', '', 'Jordan<br>Join'));
  main.appendChild(txt('p', 'role', 'Création publicitaire · Direction artistique · Marketing · Communication'));
  var foot = h('div', 'cover-foot');
  var card = h('a', 'qrcard'); card.href = OFFER_URL; card.innerHTML = qrSvg(OFFER_URL);
  var ct = h('div'); ct.appendChild(txt('b', '', 'Découvrir la page dédiée à cette candidature')); ct.appendChild(txt('span', '', shortUrl(OFFER_URL)));
  card.appendChild(ct); foot.appendChild(card);
  var who = h('div', 'who'); who.appendChild(img(D.profile.photo, D.profile.alt));
  who.appendChild(h('div', '', '<b>Jordan Join</b><br>' + D.contact.phone + ' · ' + D.contact.email + '<br>Lyon'));
  foot.appendChild(who); main.appendChild(foot);
  var mos = h('div', 'mosaic');
  ['/assets/tenofort-affiche-trail.jpg', '/assets/vogalib-affiche.jpg', '/assets/metz-lumieres-1.webp', '/assets/pandoviolet.png', '/assets/grs6.png', '/portfolio-pdf/img/real/labrha-site-01.jpg'].forEach(function (s) {
    var d = h('div'); d.appendChild(img(s, '')); mos.appendChild(d);
  });
  cover.appendChild(main); cover.appendChild(mos); pages.push(cover);

  /* ───── Pages de chaque projet ───── */
  var projPages = [];
  D.sections.forEach(function (s) {
    D.projects.filter(function (p) { return p.section === s.id; }).forEach(function (p) {
      var conf = C[p.id]; if (!conf) { console.warn('contenu manquant : ' + p.id); return; }
      var x = X[p.id] || {}, catUrl = s.all ? SITE + '/projets.html#' + s.all.anchor : allUrl;
      conf.pages.forEach(function (pc, i) {
        var pg = h('section', 'pg proj'); pg.setAttribute('data-proj', p.id);
        var top = h('div', 'top'); top.appendChild(h('span', '', '<b>' + s.title + '</b> · ' + p.title.replace(/ — .*$/, '').replace(/^« (.*) »$/, '$1')));
        top.appendChild(txt('span', 'cnt', conf.pages.length > 1 ? (i + 1) + ' / ' + conf.pages.length : ''));
        pg.appendChild(top);
        var body = h('div', 'body');
        if (pc.t === 'intro') body.appendChild(buildIntro(p, pc));
        else if (pc.t === 'text') body.appendChild(buildText(pc));
        else body.appendChild(buildGrid(pc));
        pg.appendChild(body);
        if (i === 0) {
          var bar = h('div', 'qrbar');
          if (x.video) bar.appendChild(qrBlock(x.video, x.vlabel || 'Regarder la vidéo', 'qr--video'));
          if (x.pub) bar.appendChild(qrBlock(abs(x.pub), x.plabel || 'Voir le projet en ligne'));
          bar.appendChild(qrBlock(catUrl, s.all ? 'Tous mes projets : ' + s.title.toLowerCase() : 'Découvrir tous mes projets'));
          pg.appendChild(bar);
        }
        pg.appendChild(h('div', 'bottom', '<span>Jordan Join · Portfolio</span><span class="pn"></span>'));
        pages.push(pg);
      });
    });
  });

  function buildIntro(p, pc) {
    var g = h('div', 'intro'), l = h('div');
    if (p.tag) l.appendChild(txt('p', 'tag', p.tag));
    l.appendChild(txt('h2', '', pc.title || p.title));
    if (pc.pull) l.appendChild(txt('p', 'pull', pc.pull));
    var dl = h('dl', 'kv');
    pc.kv.forEach(function (r) { var d = h('div'); d.appendChild(txt('dt', '', r[0])); d.appendChild(txt('dd', '', r[1])); dl.appendChild(d); });
    l.appendChild(dl); g.appendChild(l);
    var r = h('div', 'hero'), fr = h('div', 'frame');
    var bg = pc.hero.bg; if (bg) fr.style.background = bg;
    fr.appendChild(img(pc.hero.src, pc.hero.cap || p.title)); r.appendChild(fr);
    if (pc.hero.cap) r.appendChild(txt('div', 'cap', pc.hero.cap));
    g.appendChild(r); return g;
  }

  function section(node, label, title, paras) {
    if (label) node.appendChild(txt('p', 'lab', label));
    if (title) node.appendChild(txt('h3', 'ttl', title));
    (paras || []).forEach(function (t) { node.appendChild(txt('p', 't', t)); });
  }
  function buildText(pc) {
    var hasImgs = pc.imgs && pc.imgs.length, g = h('div', 'txt' + (hasImgs ? (pc.imgsBelow ? ' below' : pc.wideImgs ? ' wide' : '') : ' solo'));
    var l = h('div');
    section(l, pc.label, pc.title, pc.paras);
    if (pc.label2 || pc.title2 || pc.paras2) { var s2 = h('div', 'sub'); section(s2, pc.label2, pc.title2, pc.paras2); l.appendChild(s2); }
    if (pc.cards) {
      var cs = h('div', 'cards ' + (hasImgs ? 'c1' : pc.cards.length >= 3 ? 'c3' : 'c2'));
      pc.cards.forEach(function (c) { var d = h('div', 'card'); d.appendChild(txt('b', '', c.t)); d.appendChild(txt('span', '', c.d)); cs.appendChild(d); });
      l.appendChild(cs);
    }
    if (pc.note) l.appendChild(txt('p', 't', pc.note)).style.marginTop = '4mm';
    (pc.chips || []).forEach(function (c) {
      l.appendChild(txt('div', 'chip-l', c.l)); var w = h('div', 'chips'); c.items.forEach(function (it) { w.appendChild(txt('span', '', it)); }); l.appendChild(w);
    });
    g.appendChild(l);
    if (hasImgs) {
      var im = h('div', 'imgs' + (pc.mosaic ? ' tri' : '')); im.style.gridTemplateColumns = 'repeat(' + (pc.imgCols || 1) + ',1fr)';
      pc.imgs.forEach(function (it) {
        var f = h('figure'), box = h('div', 'im'); if (it.bg) box.style.background = it.bg; box.appendChild(img(it.src, it.cap || '')); f.appendChild(box);
        if (it.cap) f.appendChild(txt('figcaption', '', it.cap)); im.appendChild(f);
      });
      g.appendChild(im);
    }
    return g;
  }
  function buildGrid(pc) {
    var w = h('div', 'body-inner'); w.style.cssText = 'display:flex;flex-direction:column;flex:1;min-height:0';
    var hd = h('div', 'grid-head'); hd.appendChild(txt('p', 'lab', pc.label)); if (pc.intro) hd.appendChild(txt('p', '', pc.intro)); w.appendChild(hd);
    var g = h('div', 'grid' + (pc.fit === 'cover' ? ' cover' : '') + (pc.rows === 1 && pc.fit !== 'cover' ? ' row1' : '')); g.style.gridTemplateColumns = 'repeat(' + pc.cols + ',1fr)';
    if (pc.rows && !(pc.rows === 1 && pc.fit !== 'cover')) g.style.gridTemplateRows = 'repeat(' + pc.rows + ',1fr)';
    pc.items.forEach(function (it) {
      var f = h('figure', 'cell'), box = h('div', 'im'); if (it.bg) { box.style.background = it.bg; box.style.borderRadius = '2mm'; } box.appendChild(img(it.src, it.cap || '')); f.appendChild(box);
      if (it.cap) f.appendChild(txt('figcaption', '', it.cap)); g.appendChild(f);
    });
    w.appendChild(g); return w;
  }

  /* ───── Dernière page ───── */
  var end = h('section', 'pg end');
  var l = h('div');
  l.appendChild(txt('div', 'eyebrow', 'Pour aller plus loin'));
  l.appendChild(h('h2', '', 'Tous mes<br>projets'));
  l.appendChild(txt('p', '', 'Scannez le code pour découvrir l’ensemble de mes réalisations en ligne : visuels en grand, vidéos, sites et campagnes.'));
  var big = h('a', 'bigqr'); big.href = allUrl; big.innerHTML = qrSvg(allUrl);
  var bt = h('div'); bt.appendChild(txt('b', '', 'jordan-join.fr/projets')); bt.appendChild(txt('span', '', 'Tous les projets, par catégorie')); big.appendChild(bt);
  l.appendChild(big); end.appendChild(l);
  var cats = h('div', 'cats');
  D.sections.forEach(function (s) {
    if (!s.all) return;
    var u = SITE + '/projets.html#' + s.all.anchor, a = h('a', 'catq'); a.href = u; a.innerHTML = qrSvg(u);
    var t = h('div'); t.appendChild(txt('b', '', s.title)); t.appendChild(txt('span', '', 'Voir la catégorie')); a.appendChild(t); cats.appendChild(a);
  });
  end.appendChild(cats);
  end.appendChild(h('div', 'contact', '<b>Jordan Join</b> · ' + D.contact.phone + ' · ' + D.contact.email));
  pages.push(end);

  /* Numérotation, puis ?p=N pour ne montrer qu'une page (contrôle visuel) */
  var total = pages.length;
  pages.forEach(function (pg, i) { var pn = pg.querySelector('.pn'); if (pn) pn.textContent = (i + 1) + ' / ' + total; });
  var only = /[?&]p=(\d+)/.exec(location.search);
  pages.forEach(function (pg, i) { if (only && Number(only[1]) !== i + 1) return; doc.appendChild(pg); });
  if (only) { var st = document.createElement('style'); st.textContent = '.pg{margin:0!important;box-shadow:none!important}html,body{background:#fff!important}'; document.head.appendChild(st); }
  document.documentElement.setAttribute('data-total', String(total));
})();
</script>
</body>
</html>
